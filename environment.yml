name: causal_inference_examples
channels:
  - defaults
  - conda-forge
  - pytorch
dependencies:
  - numpy
  - pandas
  - pip
  - python>=3.12
  - matplotlib
  - scipy
  - pip:
    - dowhy
    - gcastle
    - graphviz
    - jupyterlab
    - lightgbm==4.6.0
    - miceforest==6.0.5
    - networkx
    - torch  # required for gcastle
    - scikit-learn
